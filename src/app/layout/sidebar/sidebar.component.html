<aside class="sidebar" [class.collapsed]="isCollapsed()">
  <!-- Sidebar Header -->
  <div class="sidebar-header" [class.collapsed]="isCollapsed()">
    @if(!isCollapsed()){
    <div class="emblem">
      <img src="assets/tcs-logo.png" alt="tcs-emblem" width="40" height="40" id="emblem" />
      <span class="tcs-emblem-text">Online TCS</span>
    </div>
    <button class="header-toggle-btn" (click)="toggleSidebar()" title="Collapse">
      <mat-icon>keyboard_double_arrow_left</mat-icon>
    </button>
    } @else {
    <button class="header-toggle-btn collapsed" (click)="toggleSidebar()" title="Expand">
      <mat-icon>menu</mat-icon>
    </button>
    }
  </div>

  <!-- Search Section -->
  <div class="search-container" [class.collapsed]="isCollapsed()">
    @if(!isCollapsed()){
    <div class="search-wrapper">
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" placeholder="Search menu..." class="search-input" [ngModel]="searchText()"
        (ngModelChange)="searchText.set($event)" />
    </div>
    } @else {
    <div class="search-icon-only">
      <mat-icon>search</mat-icon>
    </div>
    }
  </div>

  <!-- Mobile Toggle Button (Only on Mobile) -->
  <!-- <button class="mobile-toggle-btn" (click)="toggleMobileSidebar()">
    <mat-icon>menu</mat-icon>
  </button> -->

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <div class="category-label" *ngIf="!isCollapsed()">Main Menu</div>

    <div *ngFor="let item of filteredMenuItems()" class="menu-group">

      <!-- Menu Item (Non-parent) -->
      <div *ngIf="!item.children || item.children.length === 0">
        <button [class.active]="isActive(item.path)" class="menu-item" [title]="item.label"
          (click)="handleMenuClick(item)">
          <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
          <span class="menu-label" *ngIf="!isCollapsed()">{{ item.label }}</span>
        </button>
      </div>

      <!-- Menu Item (With submenu) -->
      <div *ngIf="item.children && item.children.length > 0">
        <button class="menu-item menu-parent" [class.expanded]="item.isExpanded" [class.active]="isActive(item.path)"
          (click)="isCollapsed() ? null : toggleSubmenu(item)" [title]="item.label"
          (mouseenter)="hoverOnSide($event, item)" (mouseleave)="leaveOnSide()">
          <mat-icon class="menu-icon">{{ item.icon }}</mat-icon>
          <span class="menu-label" *ngIf="!isCollapsed()">{{ item.label }}</span>
          <mat-icon class="expand-icon" *ngIf="!isCollapsed()">expand_more</mat-icon>
        </button>

        <!-- Submenu (Inline) -->
        <div class="submenu" *ngIf="item.isExpanded && !isCollapsed()">
          <button *ngFor="let subitem of item.children" [class.active]="isActive(subitem.path)" class="submenu-item"
            [title]="subitem.label" (click)="handleSubmenuClick(subitem, item.label)">
            <mat-icon class="submenu-icon">{{ subitem.icon }}</mat-icon>
            <span class="submenu-label">{{ subitem.label }}</span>
          </button>
        </div>


      </div>
    </div>

    <div class="category-label mt-4" *ngIf="!isCollapsed()">Support</div>
    <div class="menu-group">
      <button (click)="handleMenuClick({label: 'Help', path: '/app/help'})" [class.active]="isActive('/app/help')"
        class="menu-item" title="Help">
        <mat-icon class="menu-icon">help_outline</mat-icon>
        <span class="menu-label" *ngIf="!isCollapsed()">Help & Support</span>
      </button>
    </div>
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <div class="version" *ngIf="!isCollapsed()">v1.0.0</div>
  </div>
</aside>
