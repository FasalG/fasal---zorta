<div class="confirm-dialog">
  <div class="confirm-header">
    <mat-icon *ngIf="data?.destructive">warning</mat-icon>
    <h3>{{ data?.title || 'Confirm' }}</h3>
  </div>
  <div class="confirm-body">
    <p>{{ data?.message }}</p>
  </div>
  <div class="confirm-actions">
    <button mat-stroked-button (click)="cancel()">{{ data?.cancelLabel || 'Cancel' }}</button>
    <button mat-raised-button [color]="data?.destructive ? 'warn' : 'primary'" (click)="confirm()">{{ data?.confirmLabel || 'Confirm' }}</button>
  </div>
</div>
